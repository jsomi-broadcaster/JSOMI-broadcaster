# Performance & Build Acceleration
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configureondemand=true

# JVM Memory & Compiler Configuration
org.gradle.jvmargs=-Xmx6g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.warning.mode=all

# Android Specific Settings (Optional)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin & Ecosystem Configuration
kotlin.code.style=official
kotlin.incremental=true
